<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countries Info - Global Database</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="stars"></div>
    
    <header>
        <div class="container">
            <h1 class="logo">🌍 Countries Info</h1>
            <p class="tagline">Explore the World's Nations</p>
        </div>
    </header>

    <nav class="navbar">
        <div class="container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search country..." class="search-input">
                <span class="search-icon">🔍</span>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="economy">Economy</button>
                <button class="filter-btn" data-filter="population">Population</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="countries-grid" id="countriesGrid">
            <!-- Country cards will be generated by JavaScript -->
        </section>
    </main>

    <!-- Country Detail Modal -->
    <div class="modal" id="countryModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="modal-body" id="modalBody">
                <!-- Country details will be loaded here -->
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 Countries Info. All rights reserved. | Built with ❤️</p>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
